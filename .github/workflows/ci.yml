name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest ruff==0.15.11
      - name: Lint
        run: ruff check --output-format=github .
      - name: Tests
        run: python -m pytest -v tests
      - name: Build Docker image
        run: docker build -t salary-api .
